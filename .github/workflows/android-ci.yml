name: Android CI

on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: build with gradle
        run: ./gradlew assembleDebug